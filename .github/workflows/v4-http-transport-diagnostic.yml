name: V4 synthetic HTTP transport diagnostic

# Maintainer-approved expanded passive diagnostic only, not milestone acceptance.
# Build-preceded development workload is NOT identical first-12-gate conditioning.
# Extra synthetic CI compute is approved; original Quality gates stay unchanged.
on:
  push:
    branches: [feat/v4-work-communities]
    paths:
      - .github/workflows/v4-http-transport-diagnostic.yml
      - scripts/v4-http-transport-observer.cjs
      - scripts/v4-http-transport-diagnostic.mjs

permissions:
  contents: read

jobs:
  observe-synthetic-transport:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taleatlas_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: taleatlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://taleatlas_test:synthetic_ci_only@127.0.0.1:5432/taleatlas_test
      DATABASE_URL_DIRECT: postgresql://taleatlas_test:synthetic_ci_only@127.0.0.1:5432/taleatlas_test
      TEST_DATABASE_URL: postgresql://taleatlas_test:synthetic_ci_only@127.0.0.1:5432/taleatlas_test
      BETTER_AUTH_SECRET: synthetic-ci-auth-secret-not-for-production-12345
      APP_ORIGIN: http://127.0.0.1:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: TaleAtlas <test@example.invalid>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      # No observer preload is set during the unchanged build command.
      - run: pnpm build
      - name: Observe full original-disabled discovery (expected 17; diagnostic only)
        run: node scripts/v4-http-transport-diagnostic.mjs
      - name: Retain only sanitized synthetic socket observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-http-transport-diagnostic-sanitized
          path: |
            .local/v4-http-transport-diagnostic/**/*.jsonl
            .local/v4-http-transport-diagnostic/**/safe-summary.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
